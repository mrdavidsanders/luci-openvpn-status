<%-
  require "string"
  require "luci.sys"
  
  local client_output = luci.sys.exec("cat /tmp/openvpn_clients.htm")
 -%>

<div class="cbi-section">
        <h3><%:Active OpenVPN Clients%></h3>
        <table class="table">
                <tr class="tr table-titles">
			<th class="th" data-sortable-row="true"><%:Common Name%></th>
                        <th class="th" data-sortable-row="true"><%:VPN Address%></th>
                        <th class="th" data-sortable-row="true"><%:Remote Address%></th>
                        <th class="th" data-sortable-row="true"><%:Last Refresh%></th>
                </tr>
                <%=client_output%>
        </table>
</div>
