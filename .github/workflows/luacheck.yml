---
name: Lua Lint

on: 
  pull_request:
    branches:
      - main

jobs:
  LuaCheck:
    name: Lua Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install LuaCheck
        run: |
          DEBIAN_FRONTEND=noninteractive \
          sudo apt-get install -yq lua-check

      - name: Install LuaMin
        run: npm install luamin

      - name: Run LuaCheck
        run: |
          for x in $(ls ./libs/*.lua); do 
            luacheck $x; 
          done

      - name: Run LuaMin
        run: |
          for MOD in $(ls ./libs/*.lua); do
            sed -i "s/dprint(\".*)//g" $MOD 
            luamin -f $MOD > $MOD.min && cp $MOD.min $MOD && rm $MOD.min
          done

