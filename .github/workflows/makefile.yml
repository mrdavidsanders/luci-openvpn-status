name: luci-openvpn-status-cicd

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Install Lua 5.1
          run: |
           sudo rm /var/lib/man-db/auto-update &&
           DEBIAN_FRONTEND=noninteractive \
           sudo apt-get install -yq lua5.1

        - name: Install luamin
          run: sudo npm install -g luamin

        - name: Create Revision Name
          run: |
            if [ "${{github.ref_type }}" == "tag" ]; then \
            echo ${{ github.ref_name}} > ./MODULE_VERSION; \
            else echo "dev" > ./MODULE_VERSION; fi 

        - name: Create Version
          id: pkg-version
          run: |
            echo "${{ github.run_number }}" > ./GIT_REV &&
            echo "pkg-version=luci-openvpn-status_$(cat ./MODULE_VERSION)-$(cat ./GIT_REV)" >> "$GITHUB_OUTPUT"

        - name: Make
          run: make clean build

        - name: Upload versioned artifact
          uses: actions/upload-artifact@v4
          with:
            name: luci-openvpn-status
            path: ./build/${{ steps.pkg-version.outputs.pkg-version }}.tgz

  release:
        needs: build
        runs-on: ubuntu-latest
        if: github.ref_type == 'tag'
        steps:
        - name: Get the repo
          uses: actions/checkout@v4
        
        - name: Ensure the build folder exists
          run: mkdir -p ./build

        - name: Create Revision Name
          run: |
            if [ "${{github.ref_type }}" == "tag" ]; then \
            echo ${{ github.ref_name}} > ./MODULE_VERSION; \
            else echo "dev" > ./MODULE_VERSION; fi

        - name: Create Version
          id: pkg-version
          run: |
            echo "${{ github.run_number }}" > ./GIT_REV &&
            echo "pkg-version=luci-openvpn-status_$(cat ./MODULE_VERSION)-$(cat ./GIT_REV)" >> "$GITHUB_OUTPUT"

        - name: Download a single artifact
          uses: actions/download-artifact@v4
          with:
            name: luci-openvpn-status
            path: ./build/

        - name: Release the beast
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: >-
            gh release create ${{ github.ref_name }}
            "./build/${{ steps.pkg-version.outputs.pkg-version }}.tgz#${{ steps.pkg-version.outputs.pkg-version }}.tgz"
            --generate-notes
            --title "luci-openvpn-status ${{ github.ref_name }}-${{ github.run_number }}"
