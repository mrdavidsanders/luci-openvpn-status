name: luci-openvpn-status-cicd

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: JohnnyMorganz/stylua-action@v4
          with:
            token: ${{ secrets.GH_TOKEN }}
            version: v2.1.0
            args: false
            
        - name: Make
          run: make clean build
          
  release:
        runs-on: ubuntu-latest
        if: github.ref_type == 'tag'
        steps:
        - uses: actions/checkout@v4
        - uses: JohnnyMorganz/stylua-action@v4
	  with:
            token: ${{ secrets.GH_TOKEN }}
            version: v2.1.0
            args: false
        - uses: softprops/action-gh-release@v2
          with:
            files: ./build/*.tgz
            
        - name: Make
          run: make clean build


