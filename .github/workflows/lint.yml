---
name: Lint

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null

permissions: {}

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Super-linter
        uses: super-linter/super-linter@v5.4.2
        env:
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          FILTER_REGEX_EXCLUDE: ^.+\.md$
          BASH_SEVERITY: error
